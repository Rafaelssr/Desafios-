<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"
    >
    <link href="dashboard.css" rel="stylesheet" />
    <title>Dashboard - Desafio 03</title>
  </head>
  <body>
    <div class="additionalInfoDiv">
      <div class="tissTypeDiv">
        <h3>Tipos de Guias:</h3>
        <ul>
          <li>1 - GHI </li>
          <li>2 - SADT </li>
          <li>3 - CONSULTA</li>
        </ul>
      </div>
      <div class="quantityTpeDiv">
        <h3>Quantidades por id:</h3>
        <ul>
          <li>1 - atendimentos: 260 procedimentos</li>
          <li>2 - finanças: 295 procedimentos</li>
          <li> 3 - chaves de grupo: 439 procedimentos</li>
          <li>4 - procedimentos: 56</li>
        </ul>
      </div>
    </div>
    <div id="container">
    </div>
    <div class="paginationArea">
      <button class="firstButton">Primeiro</button>
      <button class="previousButton">Anterior</button>
      <button class="nextButton">Próximo</button>
      <button class="lastButton">Último</button>
      <div class="changeInfo">
        <button class="changeInfoButton">Faturamento</button>
      </div>
    </div>
    <div class="graphic">
      <canvas id="chartCanvas" width="900px"></canvas>
      <span class="valueText"></span>
    </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"
  ></script>
  <script type="module" src="dashboard.js"></script>
</html>
